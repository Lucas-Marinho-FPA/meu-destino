</sc-if>

<sc-if value="{{mtCo}}" hint-placeholder-val="{{ false }}">
<div class="card hero" style="gap: 4px"><p class="lbl">Total registrado desde ago/2026</p><p class="num" style="font-size: 30px">{{mCostTotal}}</p></div>
<div class="card" style="gap: 0"><sc-for list="{{mCostByItem}}" as="c" hint-placeholder-count="4"><div class="lrow"><div class="grow"><p class="txt" style="font-weight: 600">{{c.n}}</p><p class="lbl">{{c.cnt}}</p></div><p class="num val" style="font-size: 15px">{{c.v}}</p></div></sc-for></div>
</sc-if>
</sc-if>

<sc-if value="{{isMaintReg}}" hint-placeholder-val="{{ false }}">
<div class="card" style="gap: 14px">
<div class="row" style="align-items: flex-start"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3F1FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 26px"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><div class="grow" style="display: flex; flex-direction: column; gap: 4px"><p class="lbl" style="font-size: 14px; color: #E4DEFA">Serviço realizado</p><div class="row" style="flex-wrap: wrap; gap: 6px"><sc-for list="{{mfItems}}" as="o" hint-placeholder-count="5"><button class="pill" style="{{o.style}}" onClick="{{o.pick}}">{{o.n}}</button></sc-for></div></div></div>

<div class="row" style="align-items: flex-start"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3F1FF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 26px"><path d="M4 16a8 8 0 1 1 16 0M12 16l4-5"/></svg><div class="grow" style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="mfk" style="font-size: 14px; color: #E4DEFA">Quilometragem (km)</label><input id="mfk" class="inp" inputmode="numeric" value="{{mfKm}}" onChange="{{onMfKm}}"></div></div>
<div class="row" style="align-items: flex-start"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3F1FF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 26px"><path d="M14 3c3.3 0 6 1.1 6 2.5S17.3 8 14 8s-6-1.1-6-2.5S10.7 3 14 3zM8 5.5v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4"/></svg><div class="grow" style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="mfc" style="font-size: 14px; color: #E4DEFA">Custo total (R$)</label><input id="mfc" class="inp" inputmode="decimal" placeholder="0,00" value="{{mfCost}}" onChange="{{onMfCost}}"></div></div>
<div class="row" style="align-items: flex-start"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3F1FF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 26px"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h6M9 16h6"/></svg><div class="grow" style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="mfo" style="font-size: 14px; color: #E4DEFA">Observação (opcional)</label><input id="mfo" class="inp" value="{{mfObs}}" onChange="{{onMfObs}}"></div></div>
<sc-if value="{{mfHasErr}}" hint-placeholder-val="{{ false }}"><p class="mut" style="color: #FF6B7D">{{mfErr}}</p></sc-if>
<sc-if value="{{hasMSaved}}" hint-placeholder-val="{{ false }}"><p class="mut" style="color: #3FE0A0">{{mSavedMsg}}</p></sc-if>
</div>
<div class="card" style="gap: 6px; padding: 12px 14px; background: rgba(17,15,42,.55)">
<sc-if value="{{mfWhen.auto}}" hint-placeholder-val="{{ true }}"><div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B6F7" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3.5 2"/></svg><p class="mut grow">{{mfWhen.nowText}}</p></div><button class="lnk" onClick="{{mfWhen.toRetro}}" style="align-self: flex-start; min-height: 40px; padding: 4px 0">Lançamento retroativo: alterar data e hora</button></sc-if>
<sc-if value="{{mfWhen.retro}}" hint-placeholder-val="{{ false }}"><div class="grid2"><div><label class="lbl" for="mfWhend">Data (dd/mm/aaaa)</label><input id="mfWhend" class="inp" inputmode="numeric" value="{{mfWhen.date}}" onChange="{{mfWhen.onDate}}"></div><div><label class="lbl" for="mfWhent">Hora (hh:mm)</label><input id="mfWhent" class="inp" inputmode="numeric" value="{{mfWhen.time}}" onChange="{{mfWhen.onTime}}"></div></div><p class="lbl">O registro guarda também o momento real em que foi criado.</p><button class="lnk" onClick="{{mfWhen.toAuto}}" style="align-self: flex-start; min-height: 40px; padding: 4px 0">Usar data e hora atuais</button></sc-if>
</div>
<button class="btn" onClick="{{saveMaint}}" disabled="{{mfInvalid}}">Salvar manutenção</button>
<div class="card" style="gap: 0">
<div class="row" style="padding-bottom: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1FF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><p class="h2">Próximo ciclo</p></div>
<div class="lrow"><p class="txt grow">Próxima troca</p><p class="num val" style="font-size: 15px; color: #3FE0A0">{{mfNext}}</p></div>
<div class="lrow"><p class="txt grow">Intervalo</p><p class="num val" style="font-size: 15px">{{mfInterval}}</p></div>
<div class="lrow"><p class="txt grow">Previsão de custo</p><p class="num val" style="font-size: 15px">{{mfForecast}}</p></div>
</div>
</sc-if>

<sc-if value="{{isMaintItem}}" hint-placeholder-val="{{ false }}">
<div class="card" style="gap: 12px">
<label class="lbl" for="min">Serviço</label><input id="min" class="inp" placeholder="Ex.: Correia dentada" value="{{miName}}" onChange="{{onMiName}}">
<div class="grid2"><div><label class="lbl" for="mik">A cada (km)</label><input id="mik" class="inp" inputmode="numeric" value="{{miKm}}" onChange="{{onMiKm}}"></div><div><label class="lbl" for="mim">Ou a cada (meses)</label><input id="mim" class="inp" inputmode="numeric" value="{{miMonths}}" onChange="{{onMiMonths}}"></div></div>
<p class="lbl">Informe ao menos um intervalo. Respeite as recomendações do fabricante.</p>
</div>
<button class="btn" onClick="{{saveMi}}" disabled="{{miInvalid}}">Adicionar à agenda</button>
</sc-if>

</div>

<!-- ================= OFERTA: app da plataforma (simulado) + card ================= -->
<sc-if value="{{isOffer}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 30; background: #161A26; overflow: hidden">
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(28deg, rgba(120,130,160,.10) 0 2px, transparent 2px 46px), repeating-linear-gradient(-62deg, rgba(120,130,160,.08) 0 2px, transparent 2px 58px)"></div>
<svg viewBox="0 0 390 300" width="100%" height="300" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; top: 200px; left: 0"><path d="M70 230 C 120 160, 150 200, 200 130 S 300 110, 330 70" fill="none" stroke="#2F7BFF" stroke-width="6" stroke-linecap="round"/><circle cx="70" cy="230" r="9" fill="#29C46A" stroke="#FFFFFF" stroke-width="3"/><circle cx="330" cy="70" r="9" fill="#E8503A" stroke="#FFFFFF" stroke-width="3"/></svg>
<div style="position: absolute; left: 10px; right: 10px; bottom: 12px; border-radius: 26px; background: #1E2131; border: 1px solid rgba(255,255,255,.08); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; color: #F2F3F7">
<div class="sb"><span style="padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); font: 600 14px Inter, sans-serif">Categoria padrão</span><span style="font: 500 11px Inter, sans-serif; color: #9AA0B4">app da plataforma · simulado</span></div>
<p style="margin: 0; font: 700 34px Inter, sans-serif">{{of.valueText}}</p>
<p style="margin: 0; font: 500 14px Inter, sans-serif; color: #D5D8E3">{{of.pickText}}</p>
<p style="margin: 0; font: 500 14px Inter, sans-serif; color: #D5D8E3">{{of.tripText}}</p>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08)">
<div class="row" style="align-items: flex-start"><span style="width: 12px; height: 12px; border-radius: 50%; border: 3px solid #FFFFFF; flex: none; margin-top: 4px"></span><div class="grow"><p style="margin: 0; font: 500 15px Inter, sans-serif">{{of.oTxt}}</p><p style="margin: 0; font: 400 12px Inter, sans-serif; color: #9AA0B4">{{of.oSub}}</p></div></div>
<div class="row" style="align-items: flex-start"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; flex: none; margin-top: 4px"></span><div class="grow"><p style="margin: 0; font: 500 15px Inter, sans-serif">{{of.dTxt}}</p><p style="margin: 0; font: 400 12px Inter, sans-serif; color: #9AA0B4">{{of.dSub}}</p></div></div>
</div>
<button onClick="{{closeOffer}}" style="min-height: 52px; border-radius: 14px; border: 0; background: #1463F3; color: #FFFFFF; font: 600 17px Inter, sans-serif; cursor: pointer">Aceitar</button>
<button onClick="{{closeOffer}}" style="min-height: 48px; border-radius: 14px; border: 0; background: #3A3E50; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Recusar</button>
<p style="margin: 0; font: 400 11px Inter, sans-serif; color: #9AA0B4; text-align: center">O motorista decide no app da plataforma. O Meu Destino não toca nesses botões nem detecta o aceite.</p>
</div>
<div role="status" aria-label="Análise do Meu Destino" style="{{of.cardStyle}}">
<div class="sb" style="align-items: flex-start">
<div class="grow" style="display: flex; flex-direction: column; gap: 2px">
<span style="font: 500 14px Inter, sans-serif; color: #E4DEFA">{{of.impLabel}}</span>
<span class="num fitL" style="font-size: 28px; line-height: 1.1; white-space: {{of.impWs}}; color: {{of.impColor}}">{{of.impText}}</span>
<span style="font: 500 14px Inter, sans-serif; color: #E4DEFA">Nova média: <span style="font-weight: 700; color: #FFFFFF">{{of.newAvgText}}</span></span>
</div>
<span class="num val" style="font-size: 21px">{{of.rphText}}</span>
</div>
<div style="display: flex; justify-content: center"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 999px; font: 700 16px Inter, sans-serif; background: {{of.c}}; color: {{of.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{of.icon}}"/></svg>{{of.label}}</span></div>
<sc-if value="{{of.hasReasons}}" hint-placeholder-val="{{ false }}"><div class="row" style="justify-content: center; flex-wrap: wrap; gap: 6px 14px"><sc-for list="{{of.reasons}}" as="r" hint-placeholder-count="2"><span class="row" style="gap: 6px; font: 500 14px Inter, sans-serif; color: #F3F1FF; min-width: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{r.path}}"/></svg>{{r.n}}</span></sc-for></div></sc-if>
<sc-if value="{{of.hasNote}}" hint-placeholder-val="{{ false }}"><p class="lbl" style="text-align: center; font-size: 12px">{{of.note}}</p></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{leave}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(8,6,24,.7); display: flex; align-items: center; justify-content: center; padding: 24px">
<div role="alertdialog" aria-label="Alterações não salvas" style="width: 100%; max-width: 340px; background: #241F4A; border: 1px solid rgba(181,138,245,.4); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<p class="h2">Sair sem salvar?</p>
<p class="mut">Você alterou dados deste formulário. Se sair agora, as alterações serão descartadas.</p>
<button class="btn" onClick="{{leaveStay}}">Continuar editando</button>
<button class="btn2" onClick="{{leaveGo}}" style="border-color: rgba(255,107,125,.7); color: #FF9AA6">Descartar e sair</button>
</div>
</div>
</sc-if>

<nav aria-label="Navegação principal" style="display: flex; gap: 4px; margin: 6px 12px 12px; padding: 6px; border-radius: 26px; background: rgba(33,30,64,.94); border: 1px solid rgba(181,138,245,.22); box-shadow: 0 -6px 24px rgba(8,6,24,.35)">
<button class="navb" onClick="{{tabOp}}" style="{{navOp}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11M3 11h18v6H3zM6 17v2M18 17v2"/></svg>Operação</button>
<button class="navb" onClick="{{tabFin}}" style="{{navFin}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 20v-6M12 20V6M17 20v-9"/></svg>Financeiro</button>
<button class="navb" onClick="{{tabHist}}" style="{{navHist}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Histórico</button>
<button class="navb" onClick="{{tabCfg}}" style="{{navCfg}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5l2 2.6 3.2-.6.8 3.2 3 1.4-1.3 3 1.3 3-3 1.4-.8 3.2-3.2-.6-2 2.6-2-2.6-3.2.6-.8-3.2-3-1.4 1.3-3-1.3-3 3-1.4.8-3.2 3.2.6z"/></svg>Configurações</button>
</nav>
</div>
</template>
<script src="./src/runtime.js"></script>
<script src="./src/logic.js"></script>
<script src="./src/component.js"></script>
<script>
  (function () {
    var m = MeuDestinoRuntime.mount(Component, document.getElementById('app'), document.getElementById('md-template'), {});
    window.app = m.app; /* acesso para testes automatizados */
  })();
</script>
</body>
</html>
